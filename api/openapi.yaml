openapi: "3.0.3"

info:
  title: CRUD Service API
  version: "1.0.0"
  description: "Users, Posts and Comments CRUD service"

servers:
  - url: http://localhost:8080

paths:

  # ───── USERS ─────────────────────────────────────────

  /users:
    post:
      summary: Создать пользователя
      operationId: createUser
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        "201":
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "500":
          $ref: '#/components/responses/InternalError'

    get:
      summary: Получить всех пользователей
      operationId: listUsers
      tags: [users]
      responses:
        "200":
          description: Список пользователей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
        "500":
          $ref: '#/components/responses/InternalError'

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer

    get:
      summary: Получить пользователя по ID
      operationId: getUserById
      tags: [users]
      responses:
        "200":
          description: Пользователь найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'

    put:
      summary: Обновить пользователя
      operationId: updateUser
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        "204":
          description: Пользователь обновлён
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'

    delete:
      summary: Удалить пользователя
      operationId: deleteUser
      tags: [users]
      responses:
        "204":
          description: Пользователь удалён
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'

  # ───── POSTS ─────────────────────────────────────────

  /posts:
    post:
      summary: Создать пост
      operationId: createPost
      tags: [posts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        "201":
          description: Пост создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'

    get:
      summary: Получить все посты
      operationId: listPosts
      tags: [posts]
      responses:
        "200":
          description: Список постов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PostResponse'
        "500":
          $ref: '#/components/responses/InternalError'

  /posts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer

    get:
      summary: Получить пост по ID
      operationId: getPostById
      tags: [posts]
      responses:
        "200":
          description: Пост найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'

    put:
      summary: Обновить пост
      operationId: updatePost
      tags: [posts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePostRequest'
      responses:
        "204":
          description: Пост обновлён
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'

    delete:
      summary: Удалить пост
      operationId: deletePost
      tags: [posts]
      responses:
        "204":
          description: Пост удалён
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'

  # ───── COMMENTS ──────────────────────────────────────

  /comments:
    post:
      summary: Создать комментарий
      operationId: createComment
      tags: [comments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        "201":
          description: Комментарий создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'

    get:
      summary: Получить все комментарии
      operationId: listComments
      tags: [comments]
      responses:
        "200":
          description: Список комментариев
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommentResponse'
        "500":
          $ref: '#/components/responses/InternalError'

  /comments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer

    get:
      summary: Получить комментарий по ID
      operationId: getCommentById
      tags: [comments]
      responses:
        "200":
          description: Комментарий найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponse'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'

    put:
      summary: Обновить комментарий
      operationId: updateComment
      tags: [comments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCommentRequest'
      responses:
        "204":
          description: Комментарий обновлён
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'

    delete:
      summary: Удалить комментарий
      operationId: deleteComment
      tags: [comments]
      responses:
        "204":
          description: Комментарий удалён
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'

# ---------------------------------------------------------
# COMPONENTS
# ---------------------------------------------------------
components:

  schemas:

    # ── User ──────────────────────────────────────────
    CreateUserRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          example: "Ivan Petrov"
        email:
          type: string
          format: email
          example: "ivan@example.com"

    UpdateUserRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          example: "Ivan Petrov"
        email:
          type: string
          format: email
          example: "ivan@example.com"

    UserResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
        email:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ── Post ──────────────────────────────────────────
    CreatePostRequest:
      type: object
      required: [name, text, author_id]
      properties:
        name:
          type: string
          example: "Мой первый пост"
        text:
          type: string
          example: "Содержимое поста"
        author_id:
          type: integer
          example: 1

    UpdatePostRequest:
      type: object
      required: [name, text, author_id]
      properties:
        name:
          type: string
          example: "Обновлённый пост"
        text:
          type: string
          example: "Обновлённое содержимое"
        author_id:
          type: integer
          example: 1

    PostResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
        text:
          type: string
        author_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ── Comment ───────────────────────────────────────
    CreateCommentRequest:
      type: object
      required: [author_id, post_id, text]
      properties:
        author_id:
          type: integer
          example: 1
        post_id:
          type: integer
          example: 1
        text:
          type: string
          example: "Отличный пост!"

    UpdateCommentRequest:
      type: object
      required: [author_id, post_id, text]
      properties:
        author_id:
          type: integer
          example: 1
        post_id:
          type: integer
          example: 1
        text:
          type: string
          example: "Обновлённый комментарий"

    CommentResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        author_id:
          type: integer
        post_id:
          type: integer
        text:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ── Error ─────────────────────────────────────────
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "resource not found"

  responses:
    BadRequest:
      description: Неверный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'